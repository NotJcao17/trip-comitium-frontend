<div class="vote-page-wrapper">
  <div class="vote-container">

    <!-- Botón Volver -->
    <div class="mb-4">
      <a [routerLink]="['/trip', tripCode]" class="btn-tc btn-tc-glass btn-tc-sm">
        <iconify-icon icon="solar:arrow-left-broken" width="16"></iconify-icon>
        <span>Volver al Dashboard</span>
      </a>
    </div>

    <!-- Loading State -->
    <div *ngIf="isLoading" class="text-center py-5">
      <iconify-icon icon="solar:refresh-circle-broken" width="40" class="spin-icon text-sage"></iconify-icon>
      <p class="text-muted mt-2">Cargando encuesta...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="error-banner mb-4">
      <iconify-icon icon="solar:danger-triangle-broken" width="20"></iconify-icon>
      <span>{{ error }}</span>
    </div>

    <!-- Contenido Principal -->
    <div *ngIf="poll && !isLoading" class="vote-card glass-panel">

      <!-- Encabezado de Encuesta -->
      <div class="text-center mb-4">
        <span class="label-micro">{{ getPollTypeLabel() }}</span>
        <h1 class="font-bold text-white fs-2 mt-2 mb-2">{{ poll.title }}</h1>
        <p class="text-muted small mb-0">
          {{ poll.status === 'locked' ? 'Esta encuesta ha sido cerrada por el organizador.' : 'Tu voto se guarda y puedes cambiarlo antes de que cierre la encuesta.' }}
        </p>
      </div>

      <!-- Contenedor del tipo de encuesta -->
      <app-poll-container [poll]="poll"></app-poll-container>

    </div>

  </div>
</div>
