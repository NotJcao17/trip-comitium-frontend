<div class="date-selector-wrapper">

  <!-- Success Toast -->
  <div *ngIf="successMessage" class="success-banner mb-4">
    <iconify-icon icon="solar:check-circle-bold" width="18"></iconify-icon>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Dynamic Question Description -->
  <div *ngIf="poll.description" class="poll-question-desc mb-4 p-3 rounded-3 text-center">
    <iconify-icon icon="solar:info-circle-broken" width="16" class="text-sage me-1"></iconify-icon>
    <span>{{ poll.description }}</span>
  </div>

  <!-- Month Navigation Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <button type="button" class="btn-tc btn-tc-glass btn-tc-sm" (click)="changeMonth(-1)" title="Mes anterior">
      <iconify-icon icon="solar:arrow-left-broken" width="16"></iconify-icon>
    </button>
    
    <div class="text-center">
      <span class="label-micro">MES A VOTAR</span>
      <h4 class="font-bold text-white fs-5 mb-0 text-capitalize">
        {{ getMonthYearLabel() }}
      </h4>
      <span *ngIf="getVotingRangeLabel()" class="text-sage d-block mt-1 font-monospace" style="font-size: 0.76rem;">
        {{ getVotingRangeLabel() }}
      </span>
    </div>

    <button type="button" class="btn-tc btn-tc-glass btn-tc-sm" (click)="changeMonth(1)" title="Siguiente mes">
      <iconify-icon icon="solar:arrow-right-broken" width="16"></iconify-icon>
    </button>
  </div>

  <!-- Calendar Grid with Drag & Touch Swipe Support -->
  <div class="calendar-grid" (touchmove)="onTouchMove($event)">
    <div class="calendar-header-day">Dom</div>
    <div class="calendar-header-day">Lun</div>
    <div class="calendar-header-day">Mar</div>
    <div class="calendar-header-day">Mié</div>
    <div class="calendar-header-day">Jue</div>
    <div class="calendar-header-day">Vie</div>
    <div class="calendar-header-day">Sáb</div>

    <div 
      *ngFor="let day of calendarDays" 
      class="calendar-day-cell"
      [attr.data-date]="day.date"
      [class.empty]="!day.date"
      [class.disabled]="day.disabled"
      [class.selected]="day.selected"
      [class.is-today]="day.isToday"
      [class.has-votes]="authService.isAdmin() && day.voteCount > 0"
      [class.high-match]="authService.isAdmin() && day.voteCount >= 3"
      (pointerdown)="onCellPointerDown(day, $event)"
      (pointerenter)="onCellPointerEnter(day)">
      
      <span *ngIf="day.day" class="day-number">{{ day.day }}</span>
      <span *ngIf="authService.isAdmin() && day.voteCount > 0" class="vote-count-dot">{{ day.voteCount }}v</span>
    </div>
  </div>

  <!-- Admin-Only Results & Heatmap Legend -->
  <div *ngIf="authService.isAdmin()" class="d-flex justify-content-between align-items-center mt-4 text-muted small flex-wrap gap-2 p-2 rounded-3 bg-black bg-opacity-25 border border-white border-opacity-10">
    <div class="d-flex align-items-center gap-2">
      <span class="legend-box selected"></span> <span>Tus días marcados</span>
    </div>
    <div class="d-flex align-items-center gap-2">
      <span class="legend-box high-match"></span> <span>Mayor coincidencia grupal</span>
    </div>
  </div>

  <!-- Submit Button -->
  <div *ngIf="poll.status === 'active'" class="mt-4 pt-3 border-top border-white border-opacity-10 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <span class="text-muted small">
      <iconify-icon icon="solar:hand-shake-broken" width="14" class="text-sage"></iconify-icon> 
      Arrastra el cursor o dedo para marcar varios días seguidos.
    </span>
    <button 
      class="btn-tc btn-tc-primary" 
      [disabled]="selectedDates.size === 0 || isSubmitting"
      (click)="submitVote()">
      <iconify-icon icon="solar:diskette-broken" width="16"></iconify-icon>
      <span>{{ isSubmitting ? 'Guardando...' : 'Confirmar Fechas (' + selectedDates.size + ')' }}</span>
    </button>
  </div>

</div>
