<div class="poll-creator-box glass-panel p-4 mb-4">
  
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <span class="label-micro">NUEVA DECISIÓN</span>
      <h4 class="font-bold text-white fs-5 mt-1 mb-0">Configurar Nueva Encuesta</h4>
    </div>
  </div>

  <form (ngSubmit)="submit()">
    <div class="row g-3">
      
      <!-- Título -->
      <div class="col-md-7">
        <label class="form-label">Pregunta o Título *</label>
        <input 
          type="text" 
          class="form-input" 
          [(ngModel)]="title" 
          name="title" 
          placeholder="Ej. ¿Qué cabaña prefieren para el fin de semana?" 
          required>
      </div>

      <!-- Tipo de Encuesta -->
      <div class="col-md-5">
        <label class="form-label">Tipo de Decisión</label>
        <select class="form-input custom-select" [(ngModel)]="type" name="type">
          <option value="multiple_choice">Opción Múltiple</option>
          <option value="date">Calendario de Fechas</option>
          <option value="slider">Presupuesto (Slider)</option>
          <option value="tier_list">Tier List (Ranking S-A-B)</option>
          <option value="text">Propuesta Libre (Texto)</option>
        </select>
      </div>

    </div>

    <!-- Campos Dinámicos -->
    <div class="dynamic-config-box mt-3 p-3 rounded-3">
      
      <!-- Opciones para Multiple Choice y Tier List -->
      <div *ngIf="type === 'multiple_choice' || type === 'tier_list'">
        <label class="form-label">Opciones (Escribe una por renglón)</label>
        <textarea 
          class="form-input font-monospace" 
          rows="4" 
          [(ngModel)]="optionsText" 
          name="optionsText" 
          placeholder="Cabaña en el Bosque&#10;Glamping Laguna&#10;Hotel en el Centro"></textarea>
        <span class="text-muted" style="font-size: 0.75rem; display: block; margin-top: 4px;">
          Cada línea será una tarjeta seleccionable o rankeable para tus amigos.
        </span>
      </div>

      <!-- Config Slider -->
      <div *ngIf="type === 'slider'" class="row g-3">
        <div class="col-4">
          <label class="form-label">Mínimo ($)</label>
          <input type="number" class="form-input" [(ngModel)]="sliderMin" name="sliderMin">
        </div>
        <div class="col-4">
          <label class="form-label">Máximo ($)</label>
          <input type="number" class="form-input" [(ngModel)]="sliderMax" name="sliderMax">
        </div>
        <div class="col-4">
          <label class="form-label">Paso ($)</label>
          <input type="number" class="form-input" [(ngModel)]="sliderStep" name="sliderStep">
        </div>
      </div>

      <!-- Config Fechas -->
      <div *ngIf="type === 'date'" class="row g-3">
        <div class="col-6">
          <label class="form-label">Fecha Inicio</label>
          <input type="date" class="form-input" [(ngModel)]="dateStart" name="dateStart">
        </div>
        <div class="col-6">
          <label class="form-label">Fecha Fin</label>
          <input type="date" class="form-input" [(ngModel)]="dateEnd" name="dateEnd">
        </div>
      </div>

      <!-- Info Texto -->
      <div *ngIf="type === 'text'" class="text-muted small">
        <iconify-icon icon="solar:info-circle-broken" width="16" class="me-1 text-sage"></iconify-icon>
        Los miembros de la expedición tendrán un campo libre para aportar ideas o comentarios.
      </div>

    </div>

    <!-- Botón Submit -->
    <div class="d-flex justify-content-end mt-4">
      <button 
        type="submit" 
        class="btn-tc btn-tc-primary" 
        [disabled]="!title.trim() || isSubmitting">
        <iconify-icon icon="solar:add-circle-bold" width="16"></iconify-icon>
        <span>{{ isSubmitting ? 'Publicando...' : 'Publicar Encuesta' }}</span>
      </button>
    </div>

  </form>

</div>
