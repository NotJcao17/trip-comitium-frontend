<div class="tier-list-wrapper">

  <!-- Success Toast -->
  <div *ngIf="successMessage" class="success-banner mb-4">
    <iconify-icon icon="solar:check-circle-bold" width="18"></iconify-icon>
    <span>{{ successMessage }}</span>
  </div>

  <!-- Dynamic Question Description -->
  <div *ngIf="poll.description" class="poll-question-desc mb-4 p-3 rounded-3 text-center">
    <iconify-icon icon="solar:info-circle-broken" width="16" class="text-sage me-1"></iconify-icon>
    <span>{{ poll.description }}</span>
  </div>

  <p class="text-muted small mb-4 text-center">
    Arrastra y suelta cada opción dentro de la categoría que consideres adecuada.
  </p>

  <!-- Filas de Tiers (S, A, B, C, D) -->
  <div class="tier-board mb-4">
    <div *ngFor="let tier of tiers | slice:0:5" class="tier-row d-flex align-items-stretch">
      
      <!-- Tier Badge Lateral (Solo la letra grande y nítida como en la imagen) -->
      <div 
        class="tier-header d-flex align-items-center justify-content-center"
        [style.background-color]="tier.color">
        <span class="tier-letter">{{ tier.label }}</span>
      </div>

      <!-- Zona de Drop -->
      <div 
        class="tier-drop-zone flex-grow-1 p-2 d-flex flex-wrap gap-2 align-items-center" 
        cdkDropList
        [id]="'tier-' + tier.id" 
        [cdkDropListData]="tier.items" 
        [cdkDropListConnectedTo]="connectedLists"
        (cdkDropListDropped)="drop($event)">

        <div *ngFor="let item of tier.items" class="tier-drag-item" cdkDrag>
          <span class="item-label">{{ item }}</span>
          <div *cdkDragPlaceholder class="tier-item-placeholder"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- Banco de Opciones Disponibles (Pool) -->
  <div class="pool-container p-3 mb-4">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="label-micro text-white-50">OPCIONES DISPONIBLES (ARRASTRA HACIA ARRIBA)</span>
      <span class="text-muted small">{{ tiers[5].items.length }} restantes</span>
    </div>

    <div 
      class="pool-drop-zone d-flex flex-wrap gap-2 p-2"
      cdkDropList 
      id="tier-Unranked" 
      [cdkDropListData]="tiers[5].items" 
      [cdkDropListConnectedTo]="connectedLists"
      (cdkDropListDropped)="drop($event)">

      <div *ngFor="let item of tiers[5].items" class="tier-drag-item pool-item" cdkDrag>
        <span class="item-label">{{ item }}</span>
        <div *cdkDragPlaceholder class="tier-item-placeholder"></div>
      </div>

      <p *ngIf="tiers[5].items.length === 0" class="text-muted small m-0 text-center w-100 py-3 fst-italic">
        <iconify-icon icon="solar:check-circle-bold" width="16" class="text-sage me-1"></iconify-icon>
        ¡Has clasificado todas las propuestas en la tabla!
      </p>
    </div>
  </div>

  <!-- Botón Guardar -->
  <div *ngIf="poll.status === 'active'" class="mt-4 pt-3 border-top border-white border-opacity-10">
    <button 
      class="btn-tc btn-tc-primary w-100 py-3 fs-6" 
      [disabled]="isSubmitting"
      (click)="submitVote()">
      <iconify-icon icon="solar:diskette-broken" width="18"></iconify-icon>
      <span>{{ isSubmitting ? 'Guardando...' : 'Confirmar mi Clasificación' }}</span>
    </button>
  </div>

</div>
