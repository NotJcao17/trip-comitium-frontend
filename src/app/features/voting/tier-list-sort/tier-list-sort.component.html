<div class="tier-list-wrapper">

  <!-- Success Toast -->
  <div *ngIf="successMessage" class="success-banner mb-4">
    <iconify-icon icon="solar:check-circle-bold" width="18"></iconify-icon>
    <span>{{ successMessage }}</span>
  </div>

  <p class="text-muted small mb-4 text-center">
    Arrastra cada propuesta hacia la categoría correspondiente (S = Imprescindible, C = Opcional).
  </p>

  <!-- Filas de Tiers (S, A, B, C) -->
  <div class="d-flex flex-column gap-3 mb-4">
    <div *ngFor="let tier of tiers | slice:0:4" class="tier-row d-flex align-items-stretch">
      
      <!-- Tier Badge Lateral -->
      <div 
        class="tier-header d-flex align-items-center justify-content-center fw-bold"
        [style.background-color]="tier.color">
        {{ tier.label }}
      </div>

      <!-- Zona de Drop -->
      <div 
        class="tier-drop-zone flex-grow-1 p-3 d-flex flex-wrap gap-2 align-items-center" 
        cdkDropList
        [id]="'tier-' + tier.id" 
        [cdkDropListData]="tier.items" 
        [cdkDropListConnectedTo]="connectedLists"
        (cdkDropListDropped)="drop($event)">

        <div *ngFor="let item of tier.items" class="tier-drag-item" cdkDrag>
          <iconify-icon icon="solar:hamburger-menu-broken" width="14" class="drag-handle-icon"></iconify-icon>
          <span>{{ item }}</span>
          <div *cdkDragPlaceholder class="tier-item-placeholder"></div>
        </div>

        <span *ngIf="tier.items.length === 0" class="empty-tier-hint">
          Arrastra opciones aquí
        </span>

      </div>
    </div>
  </div>

  <!-- Banco de Opciones Disponibles (Pool) -->
  <div class="pool-container p-3 mb-4">
    <span class="label-micro d-block mb-2">OPCIONES DISPONIBLES (SIN CLASIFICAR)</span>
    <div 
      class="pool-drop-zone d-flex flex-wrap gap-2 min-vh-10"
      cdkDropList 
      id="tier-Unranked" 
      [cdkDropListData]="tiers[4].items" 
      [cdkDropListConnectedTo]="connectedLists"
      (cdkDropListDropped)="drop($event)">

      <div *ngFor="let item of tiers[4].items" class="tier-drag-item pool-item" cdkDrag>
        <iconify-icon icon="solar:hamburger-menu-broken" width="14" class="drag-handle-icon"></iconify-icon>
        <span>{{ item }}</span>
        <div *cdkDragPlaceholder class="tier-item-placeholder"></div>
      </div>

      <p *ngIf="tiers[4].items.length === 0" class="text-muted small m-0 text-center w-100 py-2 fst-italic">
        Todas las opciones han sido clasificadas en los tiers de arriba.
      </p>
    </div>
  </div>

  <!-- Botón Guardar -->
  <div *ngIf="poll.status === 'active'" class="mt-4 pt-3 border-top border-white border-opacity-10">
    <button 
      class="btn-tc btn-tc-primary w-100 py-3 fs-6" 
      [disabled]="isSubmitting"
      (click)="submitVote()">
      <iconify-icon icon="solar:diskette-broken" width="18"></iconify-icon>
      <span>{{ isSubmitting ? 'Guardando...' : 'Confirmar mi Tier List' }}</span>
    </button>
  </div>

</div>
