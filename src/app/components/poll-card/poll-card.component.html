<div class="bento-card poll-card-wrapper" [class.locked]="poll.status === 'locked'" (click)="onCardClick()">

  <!-- Badge de Estado -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div class="poll-icon-box">
      <iconify-icon [icon]="getSolarIcon()" width="22"></iconify-icon>
    </div>

    <div>
      <span *ngIf="poll.status === 'active' && !hasVoted" class="poll-status-chip chip-pending">
        <iconify-icon icon="solar:clock-circle-broken" width="13"></iconify-icon> Pendiente
      </span>
      <span *ngIf="poll.status === 'active' && hasVoted" class="poll-status-chip chip-voted">
        <iconify-icon icon="solar:check-circle-bold" width="13"></iconify-icon> Ya Votaste
      </span>
      <span *ngIf="poll.status === 'locked'" class="poll-status-chip chip-locked">
        <iconify-icon icon="solar:lock-broken" width="13"></iconify-icon> Cerrada
      </span>
    </div>
  </div>

  <div>
    <span class="label-micro">{{ getTypeLabel() }}</span>
    <h4 class="font-bold text-white fs-5 mt-1 mb-2">{{ poll.title }}</h4>
  </div>

  <!-- Botón inferior -->
  <div class="poll-card-footer mt-4 pt-3 d-flex justify-content-between align-items-center">
    <span class="action-hint">
      {{ poll.status === 'locked' ? 'Ver Resultados' : (hasVoted ? 'Cambiar mi voto' : 'Votar Ahora') }}
    </span>
    <iconify-icon icon="solar:arrow-right-broken" width="16" class="arrow-hint"></iconify-icon>
  </div>

</div>
